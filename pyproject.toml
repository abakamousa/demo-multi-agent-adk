[project]
name = "demo-multi-agent-adk"
version = "0.1.0"
description = "Multi-agent ADK demo with Streamlit frontend and FastAPI backend using GCP Vertex AI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Aboubakar Moussa", email = "abakamousa@gmail.com" },
]
dependencies = [
  "fastapi>=0.110.0",
  "streamlit>=1.25.0",
  "streamlit",
  "pydantic>=2.8.0",
  "uvicorn>=0.24.0",
  "langfuse>=3.3.1",
  "google-cloud-aiplatform>=1.30.0",
  "google-adk>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
] 

[project.optional-dependencies]
dev = [
  "black>=24.3.0",
  "detect-secrets>=1.5.0",
  "pre-commit>=3.7.0",
  "ruff>=0.0.291",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.27.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "backend", "utils"]
module-root = ""

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "A", "B", "C", "D", "I", "Q"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]
